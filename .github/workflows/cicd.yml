name: Independence Day Website CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # CI
  # =========================

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:latest \
            .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:latest


  # =========================
  # CD
  # =========================

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Starting deployment..."

            docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              -p "${{ secrets.DOCKERHUB_TOKEN }}"

            docker pull \
              ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:${{ github.sha }}

            docker stop independence-day || true

            docker rm independence-day || true

            docker run -d \
              --name independence-day \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/independence-day-website:${{ github.sha }}

            docker image prune -f

            echo "Deployment completed!"
